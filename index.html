<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  
  <meta name="format-detection" content="telephone=no">
  <meta http-equiv="X-UA-Compatible" content="IE=EDGE" /> 
  <title>gb1WebMap2</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="./style.css">
 
</head>
<body>
  <div id="main-layout" style="height: 100dvh; display: flex; flex-direction: column; overflow: hidden;">
    <div id="height-status-container" class="height-status">
      <span id="height-value-main">–</span>
    </div>

    <div id="height-info-box" style="position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.7); color: white; padding: 5px 10px; border-radius: 4px; pointer-events: none; display: none; z-index: 1000;">
      HA: <span id="height-value-alt">-</span> m
    </div>
    <!-- MAP-BEREICH -->
    <div id="map" class="split" style="width: 100%; position: relative;">
      <div id="myShortMessage" class="toast">Etwas ist passiert</div>
      <div id="feature-select"  class="hidden">
        <button id="close-select-btn" class="close-select-btn">✖</button>
        <h3 style="border-bottom: 1px solid #000; padding-bottom: 1px;">Suchergebnisse</h3>
        <ul id="feature-select-li"></ul>
      </div>
      
      <!-- KOORDINATEN-EINGABE -->
      <div id="coordinate_selection"
           style="position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
                  background: white; padding: 10px; border-radius: 8px; border: 1px solid #ccc;
                  z-index: 20; display: none;">
        <select name="coord_choice" id="coord_select">
          <option value="EPSG:32632" selected>EPSG:32632 (UTM, WGS84)</option>
          <option value="EPSG:25832">EPSG:25832 (UTM, ETRS89)</option>
          <option value="EPSG:3857">EPSG:3857 (Web Mercator)</option>
          <option value="EPSG:4326 (Breite,Länge!)">EPSG:4326 (Länge-/Breite)</option>
          <option value="EPSG:31467">EPSG:31467 (GK, 3M)</option>
          <option value="EPSG:31466">EPSG:31466 (GK, 2M)</option>
        </select>
        <button id="start-coord-input" style="margin-left: 5px;">📍 Koordinate eingeben</button>
      </div>
    </div> <!-- ENDE MAP -->
    <!-- TABELLENBEREICH -->
    <div id="table-container" class="split">
      <div id="table-header">
        <div class="header-controls-left">
          <strong>Ebene:</strong>
          <select id="layer-selector">
          </select>
        </div>    
        <div id="table-controls">
          <button id="filter-toggle" class="btn-control">Filtern</button>
          <button id="table-reset" title="Tabellenlayout zurücksetzen">🔄</button>
          <button id="popout-table-btn" title="In neues Fenster auslagern" style="margin-right: 5px; padding: 2px 6px; cursor: pointer;">🗗</button>
          <button id="add-data-btn" title="Daten hinzufügen" style="margin-right: 5px; padding: 2px 6px; cursor: copy;">➕</button>
        </div>
        <button id="close-table-btn">✕ Schließen</button>
      </div>

      <div id="wms_data_table" class="hide-filters"></div>
    </div>
    <!-- POPUP -->
    <div id="popup" class="ol-popup">
      <a href="#" id="popup-closer" class="ol-popup-closer">✕</a>
      <div id="popup-content"></div>
    </div>
    <!-- FILE INPUT -->
    <input type="file" id="geojsonInput" accept=".geojson,.json" style="display: none;" multiple>
  </div> <!-- ENDE main-layout -->
 <div id="daten-modal" class="modal-overlay">
  <div class="modal-container">
    <div class="modal-header">
      <h3>Objektdaten</h3>
      <button id="close-daten-modal">&times;</button>
    </div>
    <div id="daten-modal-content"></div>
  </div>
</div>
  <div id="draw-bar" style="display: none !important;">
  <button id="draw-none" class="draw-btn active" data-type="None" title="Navigation (Ausschalten)">🖐️</button>
  <button id="draw-point" class="draw-btn" data-type="Point" title="Punkt zeichnen">📍</button>
  <button id="draw-text" class="draw-btn" data-type="Text" title="Text hinzufügen">📝</button>
  <button id="draw-line" class="draw-btn" data-type="LineString" title="Linie zeichnen">📏</button>
  <button id="draw-poly" class="draw-btn" data-type="Polygon" title="Fläche zeichnen">⭓</button>
  <button id="draw-circle" class="draw-btn" data-type="Circle" title="Kreis zeichnen">⭕</button>
  <button id="draw-translate" class="draw-btn" data-type="Translate" title="Ganze Objekte verschieben">🖐️↕️</button>
  <button id="draw-export" title="Zeichnungen als GeoJSON exportieren">💾</button>
  <button id="draw-clear" class="draw-btn" data-type="Delete" title="Einzelne Objekte durch Anklicken löschen">🗑️</button>
  </div>
  <div id="wfs-loader" style="display: none !important;">
  <input type="text" id="wfs-url" placeholder="WFS Basis-URL eingeben (ohne ?)" />
  <button id="load-wfs-btn">WFS laden</button>
  <div id="wfs-layer-list"></div>
  </div>

<!-- Der mobile Menü-Button im OpenLayers-Design -->
<div id="sidebar-toggle-control" class="ol-control mobile-sidebar-control">
  <button id="mobile-menu-btn" title="Menü öffnen" type="button">☰</button>
</div>

<!-- Die mobile Seitenleiste & Overlay (bleiben wie gehabt) -->
<div id="mobile-sidebar" class="sidebar">
  <div class="sidebar-header">
    <h3>Foto</h3>
    <button id="close-sidebar-btn" class="close-btn">&times;</button>
  </div>
  <div class="sidebar-content">
    <ul class="sidebar-actions">
      <li>
        <div style="display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end;">
          <div style="display:flex; flex-direction:column; min-width:130px;">
            <label for="photo-title">Titel (GEW)</label>
            <input id="photo-title" type="text" maxlength="200" placeholder="Titel (GEW) zum Foto">
          </div>
          <div style="display:flex; flex-direction:column; min-width:110px;">
            <label for="photo-kilometer">Gewässerkilometer</label>
            <input id="photo-kilometer" type="number" min="0" step="1" placeholder="km">
          </div>
          <div style="display:flex; flex-direction:column; min-width:90px;">
            <label for="photo-gew-seite">Gewässerseite</label>
            <input id="photo-gew-seite" type="text" maxlength="1" placeholder="R/L/M">
          </div>
          <div style="display:flex; flex-direction:column; min-width:100px;">
            <label for="photo-gew-ri">Richtungsinfo</label>
            <input id="photo-gew-ri" type="text" maxlength="2" placeholder="gF/iF">
          </div>
        </div>
        <label for="photo-description">Beschreibung (optional)</label>
        <input id="photo-description" type="text" maxlength="200" placeholder="Beschreibung zum Foto">
        <button id="take-photo-btn" type="button">📷 Foto aufnehmen</button>
        <button id="export-photo-csv-btn" type="button">📄 Fotostandorte CSV exportieren</button>
        <button id="export-photo-geojson-btn" type="button">🗺️ Fotostandorte exportieren</button>
        <button id="clear-photo-database-btn" type="button">🗑️ Fotodatenbank bereinigen</button>
      </li>
    </ul>
    <p id="photo-storage-status" class="photo-storage-status" role="status"></p>
    <div id="photo-location-actions" class="photo-location-actions" hidden>
      <button id="choose-photo-location-btn" type="button">Standort neu wählen</button>
      <button id="choose-photo-direction-btn" type="button">Richtung neu wählen</button>
      <button id="save-photo-btn" type="button" disabled>Foto speichern</button>
    </div>
    <button id="cancel-photo-location-btn" class="cancel-photo-location-btn" type="button" hidden>
      Auswahl abbrechen
    </button>
    <div id="sidebar-layer-switcher"></div>
  </div>
</div>

<div id="sidebar-overlay" class="sidebar-overlay"></div>
<input type="file" id="camera-input" accept="image/*" capture="environment" hidden>
<div class="sidebar-section">
  <h4 class="sidebar-section-title">Legenden: Bauwerke</h4>
  <!-- Hier werden die Accordion-Einträge dynamisch hineingeneriert -->
  <div id="bauwerke-accordion" class="accordion-container"></div>
</div>


<div class="sidebar-section">
  <h4 class="sidebar-section-title">Legenden: Bauwerke</h4>
  <!-- Hier werden die Accordion-Einträge dynamisch hineingeneriert -->
  <div id="bauwerke-accordion" class="accordion-container"></div>
</div>


  <script type="module" src="/main.js"></script>
</body>


</html>
